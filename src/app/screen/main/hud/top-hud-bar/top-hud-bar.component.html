<div
  class="absolute left-0 right-0 top-0 flex bg-wood-default px-2 py-1 border-b-border-subtle border-b-2"
>
  <div
    class="border-border-subtle border-2 flex items-center justify-center rounded-xl"
  >
    <img
      src="assets/monster/slime/Slime_Base.webp"
      alt="slime portrait"
      class="h-9 w-9 scale-150 object-contain"
    />
  </div>

  <div
    class="relative flex flex-1 items-center justify-between px-2 rounded-xl"
  >
    <app-hud-resource-chip
      iconSrc="assets/object/Wheat.webp"
      alt="Wheat"
      [value]="wheat()"
    />
    <app-hud-resource-chip
      iconSrc="assets/object/Soul.webp"
      alt="Soul"
      [value]="soul()"
    />
    <app-hud-resource-chip
      iconSrc="assets/object/Glitched_Stone.webp"
      alt="Glitched stone"
      [value]="glitchedStone()"
      [largeIcon]="true"
    />
    <app-hud-resource-chip
      iconSrc="assets/object/Glitched_Stone.webp"
      alt="Glitched stone"
      [value]="glitchedStone()"
      [largeIcon]="true"
    />
  </div>
</div>
