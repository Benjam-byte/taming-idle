<div class="hud-slot relative flex min-w-24 items-center justify-center gap-2 rounded-lg px-3 py-1">
  <img
    class="h-5 w-5 object-contain"
    [class.resource-icon-large]="largeIcon()"
    [src]="iconSrc()"
    [alt]="alt()"
  />
  <span class="resource-value text-sm font-bold text-text-primary">
    {{ value() }}
  </span>
</div>
