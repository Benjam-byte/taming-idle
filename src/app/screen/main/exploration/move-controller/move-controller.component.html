<div class="move-controller" aria-label="Movement controller">
  <button
    type="button"
    class="move-button move-up"
    (pointerdown)="moveRequested.emit('UP')"
    aria-label="Move up"
  >
    ↑
  </button>

  <button
    type="button"
    class="move-button move-left"
    (pointerdown)="moveRequested.emit('LEFT')"
    aria-label="Move left"
  >
    ←
  </button>

  <div class="move-center" aria-hidden="true"></div>

  <button
    type="button"
    class="move-button move-right"
    (pointerdown)="moveRequested.emit('RIGHT')"
    aria-label="Move right"
  >
    →
  </button>

  <button
    type="button"
    class="move-button move-down"
    (pointerdown)="moveRequested.emit('DOWN')"
    aria-label="Move down"
  >
    ↓
  </button>
</div>
