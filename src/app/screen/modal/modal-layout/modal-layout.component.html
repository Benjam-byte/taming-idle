<div class="absolute inset-0 -z-10 bg-primary-900 bg-cover bg-center"></div>

<div class="flex h-dvh flex-col pt-[env(safe-area-inset-top)]">
  @if (title()) {
    <app-header></app-header>
  }

  <main class="min-h-0 flex-1 overflow-hidden p-3">
    <div class="inset-panel flex h-full min-h-0 flex-col p-3">
      <ng-content></ng-content>
    </div>
  </main>

  <footer class="hud-bar hud-bar-bottom top-shadow">
    @if (showMenuButton()) {
      <app-ui-icon-button size="sm" label="Menu" (pressed)="goToMenu()">
        <img
          src="assets/icon/main-menu.png"
          alt=""
          class="h-5 w-5 object-contain"
        />
      </app-ui-icon-button>
    }
  </footer>
</div>
