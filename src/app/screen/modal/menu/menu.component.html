<div class="m-2">
  <app-header (closeModal)="closeModal()" label="MENU" />
</div>
<div
  class="flex flex-1 gap-4 mx-2 mb-8 bg-wood-default border-2 border-border-warm rounded-2xl"
>
  <div class="flex-1 m-2 px-[1px] bg-parchment-default rounded-2xl">
    @for (section of sections; track section.title) {
      <section class="flex flex-col gap-0">
        <div class="flex flex-row justify-evenly items-center">
          <div class="border-t-2 border-border-warm w-20 h-1"></div>
          <h3 class="section-title">{{ section.title }}</h3>
          <div class="border-t-2 border-border-warm w-20 h-1"></div>
        </div>

        <div
          class="grid grid-cols-[repeat(auto-fill,minmax(72px,1fr))] justify-items-center gap-x-3 gap-y-4"
        >
          @for (item of section.items; track item.label) {
            <app-menu-button
              [label]="item.label"
              [iconSrc]="item.iconSrc"
              [disabled]="item.disabled ?? false"
              (selected)="selectItem(item)"
            />
          }
        </div>
      </section>
    }
  </div>
</div>
