<div class="flex min-w-16 flex-col items-center gap-1.5 text-center font-title text-xs font-extrabold leading-tight text-text-primary">
  <app-ui-icon-button
    size="lg"
    [label]="label()"
    [disabled]="disabled()"
    (pressed)="press()"
  >
    <img
      [src]="displayedIconSrc()"
      alt=""
      class="h-7 w-7 object-contain"
    />
  </app-ui-icon-button>

  <span class="max-w-[72px] [overflow-wrap:anywhere]">{{ label() }}</span>
</div>
