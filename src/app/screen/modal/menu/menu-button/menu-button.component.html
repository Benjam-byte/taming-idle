<button
  type="button"
  class="menu-button flex flex-col items-center bg-parchment-highlight"
  [disabled]="disabled()"
  (click)="press()"
>
  <span
    class="flex size-14 items-center justify-center bg-inset-default rounded-xl m-1"
  >
    <img
      [src]="displayedIconSrc()"
      alt=""
      class="button-icon h-7 w-7 object-contain"
    />
  </span>

  <span class="button-title text-center py-1">{{ label() }}</span>
</button>
