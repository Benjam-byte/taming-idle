<button
  type="button"
  class="big-icon-button bg-wood-elevated size-11 flex justify-center items-center"
  (click)="onClicked()"
>
  <div
    class="size-6 rounded-md flex justify-center items-center text-text-primary"
  >
    @switch (icon()) {
      @case ('arrow-left') {
        <app-icon-arrow-left [size]="20" [strokeWidth]="12" />
      }
      @case ('arrow-right') {
        <app-icon-arrow-right [size]="20" [strokeWidth]="12" />
      }
      @case ('arrow-up') {
        <app-icon-arrow-up [size]="20" [strokeWidth]="12" />
      }
      @case ('arrow-down') {
        <app-icon-arrow-down [size]="20" [strokeWidth]="12" />
      }
      @case ('chevron-left') {
        <app-icon-chevron-left [size]="20" [strokeWidth]="12" />
      }
      @case ('chevron-right') {
        <app-icon-chevron-right [size]="20" [strokeWidth]="12" />
      }
      @case ('chevron-up') {
        <app-icon-chevron-up [size]="20" [strokeWidth]="12" />
      }
      @case ('chevron-down') {
        <app-icon-chevron-down [size]="20" [strokeWidth]="12" />
      }
    }
  </div>
</button>
