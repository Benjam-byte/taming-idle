<button
  type="button"
  class="hud-slot ui-icon-button"
  [class.icon-button-small]="size() === 'sm'"
  [class.icon-button-medium]="size() === 'md'"
  [class.icon-button-large]="size() === 'lg'"
  [class.icon-button-labeled]="labeled()"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="pressed.emit($event)"
>
  <ng-content></ng-content>
</button>
